apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: checkout-service
  labels:
    app: checkout-service
    tier: backend
    managed-by: platform
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: checkout-service
      containers:
        - name: checkout-service
          image: registry.internal.acme.example/checkout-service:2.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9102
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: checkout-service
            - name: LOG_LEVEL
              value: info
            - name: DB_HOST
              value: acme-prd-checkout-primary-postgres.internal.acme.example
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: checkout_orders
            - name: DB_POOL_MAX
              value: "20"
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.payment-service.svc.cluster.local
            # Valori sensibili risolti da Secret, mai in chiaro nel manifest.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: checkout-service-secrets
                  key: database-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-service-secrets
                  key: database-password
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: checkout-service-secrets
                  key: session-signing-key
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: checkout-service
  labels:
    app: checkout-service
spec:
  type: ClusterIP
  selector:
    app: checkout-service
  ports:
    - name: http
      port: 80
      targetPort: 8081
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service-metrics
  namespace: checkout-service
  labels:
    app: checkout-service
spec:
  type: ClusterIP
  selector:
    app: checkout-service
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
      protocol: TCP
