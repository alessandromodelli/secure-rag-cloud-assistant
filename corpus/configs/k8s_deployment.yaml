apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      serviceAccountName: payment-sa
      containers:
        - name: app
          image: internal-registry.example.com/payment-service:1.4.2
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          env:
            - name: DB_PASSWORD
              value: "PaymentDB!2024prod"
            - name: API_KEY
              value: "pk_live_FAKE_payment_processor_key_abc123"
          ports:
            - containerPort: 8080
